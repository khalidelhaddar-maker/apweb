<!DOCTYPE html>
<html>
    <head>
        <title>Prueba de estilos css externo</title>
        <link rel="stylesheet" href="prueba_css.css"/>
        <style>
            p {
                background-color: blue;
                font-family:Arial, 'Courier New', Courier, monospace; /* tipo de la fuente 
                font-size: large; /*tamaño de la fuente*/

            }
            .importante{

            }

        <p>Primer parrafo</p>
        <P class="importante">Segundo parrafo</P>
        <P id="tercerp">Tercer parrafo</P> 
        <div class="importante">
            aaaaaaaaaaa

        </div>
    </body>
