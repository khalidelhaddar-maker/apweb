<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Práctica Divs y Spans - Corregida</title>
</head>
<body>

    <!-- 1. PRIMER DIV HORIZONTAL: Combinación de Morado y Rojo -->
    <div style="height: 120px; background-color: purple; padding: 15px; box-sizing: border-box;">
        <div style="height: 100%; background-color: red; padding: 10px; box-sizing: border-box; color: white;">
            Primer bloque horizontal (Contenedor Rojo dentro de Morado)
        </div>
    </div>

    <!-- 2. SEGUNDO DIV HORIZONTAL: Contenedor Amarillo con el texto formateado -->
    <div style="height: 100px; background-color: yellow; padding: 20px; box-sizing: border-box; color: black; margin-top: 10px;">
        Texto normal del bloque. <span style="color: green; font-size: xx-large; font-weight: bold;">de color verde y tamaño xxl</span>
    </div>

    <!-- 3. TERCER DIV HORIZONTAL: Contenedor Verde Oscuro con los bloques A, B y C en línea -->
    <!-- 'overflow: hidden' limpia los floats de los hijos para que el contenedor verde mantenga su altura -->
    <div style="background-color: darkgreen; padding: 15px; overflow: hidden; margin-top: 10px;">
        
        <!-- Bloque A con float: left -->
        <div style="width: 30%; height: 80px; background-color: lightgreen; float: left; margin-right: 3%; text-align: center; line-height: 80px; color: black;">
            Bloque A
        </div>

        <!-- Bloque B con float: left -->
        <div style="width: 30%; height: 80px; background-color: #a9dfbf; float: left; margin-right: 3%; text-align: center; line-height: 80px; color: black;">
            Bloque B
        </div>

        <!-- Bloque C con float: left -->
        <div style="width: 34%; height: 80px; background-color: #7dcea0; float: left; text-align: center; line-height: 80px; color: black;">
            Bloque C
        </div>

    </div>

</body>
</html>
